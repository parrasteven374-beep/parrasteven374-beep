name: Generate Bomberman Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate the SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: parrasteven374-beep
          outputs: |
            dist/bomberman-contribution-graph.svg
            dist/bomberman-contribution-graph-dark.svg?theme=bomberman

      - name: Push the SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: pacman-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
